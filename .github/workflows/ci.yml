name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aigov
          POSTGRES_PASSWORD: aigov
          POSTGRES_DB: aigov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigov"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://aigov:aigov@localhost:5432/aigov_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/gateway

  ner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ner/requirements.txt
      - run: pip install -r requirements.txt
      - run: |
          for m in de_core_news_md en_core_web_md fr_core_news_md es_core_news_md it_core_news_md; do
            pip install "https://github.com/explosion/spacy-models/releases/download/$m-3.8.0/$m-3.8.0-py3-none-any.whl"
          done
      - run: pytest -q
  alerts:
    name: Alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Prometheus config and alert rules
        run: |
          touch deploy/prometheus/metrics-token   # git-ignored; promtool only needs the file to exist
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: Unit-test alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/rules" -w /rules --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules alerts_test.yml