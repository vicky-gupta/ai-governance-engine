services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aigov
      POSTGRES_PASSWORD: aigov
      POSTGRES_DB: aigov
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:

